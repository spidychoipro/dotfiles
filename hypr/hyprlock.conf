general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/backgrounds/anime-1p5z71.jpeg
    blur_passes = 2
    blur_size = 6
    brightness = 0.55
    contrast = 0.9
    vibrancy = 0.15
    noise = 0
}

# Time — the focal point
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f8f8f2ee)
    font_size = 110
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 0, 60
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 6
    shadow_boost = 0.5
}

# Date — quiet, right under the time
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(bd93f9cc)
    font_size = 20
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}

# Status word — small, near the input, not competing with the time
label {
    monitor =
    text = 
    color = rgba(6272a4ff)
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text = <span foreground="##6272a4">Enter password</span>
    hide_input = false

    inner_color = rgba(282a36bb)
    outer_color = rgba(bd93f955)
    check_color = rgba(50fa7bff)
    fail_color = rgba(ff5555ff)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    font_color = rgba(f8f8f2ff)

    rounding = 16
    position = 0, -195
    halign = center
    valign = center
}
