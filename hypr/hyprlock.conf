general {
    hide_cursor = true
}


background {
    monitor =

    path = ~/.config/backgrounds/shaded.png

    blur_passes = 3
    blur_size = 8

    brightness = 0.45
    noise = 0.02
}


# Lock indicator
label {
    monitor =

    text = 󰌾 Locked

    color = rgb(bd93f9)

    font_size = 22
    font_family = JetBrainsMono Nerd Font

    position = 0, 230

    halign = center
    valign = center
}


# Clock
label {
    monitor =

    text = cmd[update:1000] date +"%H:%M"

    color = rgb(f8f8f2)

    font_size = 88
    font_family = JetBrainsMono Nerd Font

    position = 0, 120

    halign = center
    valign = center
}


# Date
label {
    monitor =

    text = cmd[update:60000] date +"%A, %B %d"

    color = rgb(bfbfbf)

    font_size = 24
    font_family = Pretendard

    position = 0, 35

    halign = center
    valign = center
}


# Password input
input-field {
    monitor =

    size = 300, 55

    outline_thickness = 2

    dots_size = 0.25
    dots_spacing = 0.25

    fade_on_empty = true

    inner_color = rgba(40,42,54,120)

    outer_color = rgba(bd93f9aa)

    check_color = rgba(50fa7bff)

    fail_color = rgba(ff5555ff)


    font_color = rgb(f8f8f2)

    rounding = 18


    position = 0, -90

    halign = center
    valign = center
}
