general {
    lock_cmd = pidof hyprlock || hyprlock

    # 절전 직전에 잠금화면을 내린다. 재개 시 깨우기 위해 누른 키가 hyprlock의
    # 비밀번호 칸으로 들어가는 것을 막기 위함 (세션 잠금 상태는 유지됨).
    # loginctl lock-session이 hyprlock을 띄운 뒤 종료하므로 짧은 대기 후 종료.
    before_sleep_cmd = loginctl lock-session; sleep 0.2; pkill -x hyprlock

    # 재개 직후의 키 입력이 사라지도록 잠금화면을 조금 늦게 다시 띄운다.
    after_sleep_cmd = sleep 0.3; pidof hyprlock || hyprlock
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
