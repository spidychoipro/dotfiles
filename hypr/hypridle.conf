general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    # 절전 직전에 플래그를 만든다. 백그라운드 sleep은 절전 중 멈췄다가
    # 재개 1초 뒤 플래그를 지운다. hyprlock은 죽이지 않는다.
    on-timeout = touch "$HOME/.cache/hypr-wake-space.flag"; (sleep 1; rm -f "$HOME/.cache/hypr-wake-space.flag") & systemctl suspend
}
