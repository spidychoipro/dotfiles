add_newline = true

format = """
╭─[](fg:surface0)\
$time$custom$username$hostname\
[](fg:surface0 bg:orange)\
$directory\
$git_branch$git_status$python$cmd_duration$status\
[](fg:orange)\
$line_break╰─$character"""

nodejs = { disabled = true }
rust = { disabled = true }
golang = { disabled = true }
package = { disabled = true }
docker_context = { disabled = true }
aws = { disabled = true }
gcloud = { disabled = true }
fill = { disabled = true }

palette = "dracula"

[palettes.dracula]
surface0 = "#44475a"
comment = "#6272a4"
fg = "#f8f8f2"
purple = "#bd93f9"
green = "#50fa7b"
cyan = "#8be9fd"
pink = "#ff79c6"
bg = "#282a36"
red = "#ff5555"
orange = "#ffb86c"

[time]
disabled = false
time_format = "%H:%M"
style = "bg:surface0 fg:fg"
format = "[  $time ]($style)"

[custom.os]
command = "echo ''"
when = true
style = "bg:surface0 fg:fg"
format = "[ $output ]($style)"

[username]
show_always = true
format = "[$user](bg:surface0 fg:fg)"

[hostname]
ssh_only = false
style = "bg:surface0 fg:fg"
format = "[@$hostname]($style)"
disabled = false

[directory]
style = "bg:orange fg:bg"
format = "[ $path ]($style)"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bg:green"
format = '[[](fg:orange bg:green)[  $branch ](fg:bg bg:green)]($style)'

[git_status]
style = "bg:green"
format = '[[($all_status$ahead_behind)](fg:bg bg:green)]($style)'
conflicted = " "
up_to_date = ""
untracked = " ?"
stashed = " $"
modified = " !"
staged = " +"
renamed = " »"
deleted = " ✘"
ahead = " ⇡${count}"
behind = " ⇣${count}"
diverged = " ⇕${ahead_count}${behind_count}"

[python]
symbol = ""
style = "bg:cyan"
format = '[[](fg:green bg:cyan)[ $symbol$version( \($virtualenv\)) ](fg:bg bg:cyan)]($style)'
python_binary = ["python3", "python"]

[cmd_duration]
min_time = 2000
style = "bg:cyan"
format = '[[](fg:green bg:cyan)[  $duration ](fg:bg bg:cyan)]($style)'

[status]
disabled = false
style = "bg:cyan"
format = '[[](fg:green bg:cyan)[ $symbol$status ](fg:red bg:cyan)]($style)'
symbol = "✗ "
success_symbol = ""

[character]
success_symbol = "[❯](bold fg:green)"
error_symbol = "[❯](bold fg:red)"
format = "$symbol "
