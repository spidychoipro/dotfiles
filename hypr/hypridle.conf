general {
    lock_cmd = [ -f "$HOME/.cache/hyprlock-suspend.flag" ] || pidof hyprlock || hyprlock

    # 절전 준비 중에는 lock_cmd가 잠금화면을 다시 띄우지 않도록 플래그만 만든다.
    # 여기서 pkill을 넣으면 절전에 걸려 멈춘 셸이 재개 뒤에 실행되어,
    # AFTER_SLEEP_CMD로 새로 띄운 hyprlock을 다시 죽인다. 종료는 600초 on-timeout에서만 한다.
    before_sleep_cmd = touch "$HOME/.cache/hyprlock-suspend.flag"; loginctl lock-session

    # 재개 직후 플래그를 지우고 잠금화면을 다시 띄운다.
    after_sleep_cmd = rm -f "$HOME/.cache/hyprlock-suspend.flag"; sleep 0.3; pidof hyprlock || hyprlock
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600
    # before_sleep_cmd는 비동기라 절전보다 늦게 끝날 수 있다.
    # 여기서 먼저 종료한 뒤 절전을 시작해 wake 키가 비밀번호 칸으로 들어가지 않게 한다.
    on-timeout = touch "$HOME/.cache/hyprlock-suspend.flag"; pkill -x hyprlock; for i in 1 2 3 4 5; do pidof hyprlock >/dev/null || break; sleep 0.1; done; systemctl suspend

    # 실제 절전이 없었더라도(다른 프로세스가 절전을 막은 경우) 잠금화면을 복구한다.
    on-resume = rm -f "$HOME/.cache/hyprlock-suspend.flag"; pidof hyprlock || hyprlock
}
